name: Build

# Compile and run the tests on every OS for each push and pull request, so breakage shows up
# before a release tag. Releases themselves are built by release.yaml.
on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # build = compile, Room schema export, Koin compile-time graph check and unit tests.
      - name: Build and test
        shell: bash
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
